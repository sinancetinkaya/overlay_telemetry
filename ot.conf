# overlay_telemetry.py parameters
#
# Read automatically when this file exists; command-line options override it.
# One 'key = value' per line; a blank value means the built-in default.
# Commented-out 'key = value' lines are the other (non-active) values:
# move the '#' to switch to one. The --video file is never stored here.

# TCX activity file with track points and telemetry
# Built-in default: (none)
tcx =
# tcx = activity.tcx

# Output video file. Default: <video>_overlay<ext> next to the input video.
output =
# output = output.mp4

# Hours to ADD to UTC for local time (e.g. 3 for UTC+3). Overrides auto-
# detection. If omitted, the timezone is auto-detected from the TCX's first
# coordinates.
# Built-in default: (none)
tz-offset =
# tz-offset = 3

# IANA timezone name to interpret the local time in (e.g. Europe/Istanbul).
# Overrides auto-detection, but is itself overridden by --tz-offset if both
# are given.
# Built-in default: (none)
tz-name =
# tz-name = Europe/Istanbul

# Extra seconds to shift the telemetry relative to the video, for manual fine
# sync if things still look off.
# Built-in default: 0.0
gps-offset = 0.0
# gps-offset = 1.5

# Frame rate to render the telemetry overlay at. Default: 5.
overlay-fps = 5.0
# overlay-fps = 10

# Smoothing window in seconds for speed/pace and grade. Use 0 to disable.
# Default: 0.
smooth-window = 10
# smooth-window = 3

# Keep the temporary overlay frames/video instead of deleting them. Default:
# off.
keep-temp = off
# keep-temp = on

# Show the speed panel. Default: on.
speed = on
# speed = off

# Show the grade panel. Default: on.
grade = on
# grade = off

# Show the heart-rate panel. Default: on.
heartrate = on
# heartrate = off

# Show the mini route map. Default: on.
minimap = on
# minimap = off

# Show the lat/lon readout. Default: on.
latlong = on
# latlong = off

# Show the date/time readout. Default: on.
timestamp = on
# timestamp = off

# Display speed as 'speed' (km/h) or 'pace' (min:sec per km). Default: speed.
speed-type = speed
# speed-type = pace

# Max heart rate (bpm). If given, the HR panel shows % of max instead of raw
# bpm.
# Built-in default: (none)
max-hr = 183
# max-hr = 190

# Show the wind direction/speed box (weather from Open-Meteo, needs internet).
# Default: on.
wind = on
# wind = off

# Where the wind comes from: 'archive' (ERA5 reanalysis), 'forecast' (Open-
# Meteo forecast API's past data) or 'auto' (archive when it fully covers the
# video, otherwise forecast). Default: auto.
wind-source = auto
# wind-source = archive
# wind-source = forecast

# How many locations along the video's part of the track to fetch wind for;
# the wind at your GPS position is blended from them (spots closer than 1 km
# are merged). Default: 3.
wind-points = 3
# wind-points = 1

# Arrow points where the wind blows 'to' (default) or where it comes 'from'.
wind-arrow = to
# wind-arrow = from

# What points UP in the wind compass: the GPS route direction ('heading',
# default - arrow shows wind relative to your travel direction) or true north
# ('north').
wind-up = heading
# wind-up = north

# Speed shown in the wind box: hourly maximum gust (labelled "Gust") or mean wind speed
wind-speed-type = gust
# wind-speed-type = mean